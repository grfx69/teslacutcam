# Tesla Cut Cam Export: static site + /geo proxy, for teslacutcam.wackedoodle.com via Cloudflare Tunnel.
# nginx listens only on localhost:8124; cloudflared forwards https://teslacutcam.wackedoodle.com -> http://localhost:8124
# Install: sudo cp nginx-teslacutcam.conf /etc/nginx/sites-available/teslacutcam
#          sudo ln -s /etc/nginx/sites-available/teslacutcam /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 127.0.0.1:8124;
    server_name teslacutcam.wackedoodle.com;
    root /var/www/teslacutcam;          # contents of dist/
    index index.html;

    # the app never uploads footage; keep request bodies tiny
    client_max_body_size 16k;

    # (nginx drops server-level add_header in any location that sets its own, so the security
    #  headers live in a snippet-like set repeated where needed)
    set $tcc_pp "geolocation=(), camera=(), microphone=()";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy $tcc_pp always;

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy same-origin always; add_header Permissions-Policy $tcc_pp always; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy same-origin always; add_header Permissions-Policy $tcc_pp always; }
    location / { try_files $uri $uri/ /index.html; }

    # same-origin reverse geocoding (Python helper in --web mode on 127.0.0.1:8125)
    location /geo {
        proxy_pass http://127.0.0.1:8125;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s; proxy_read_timeout 15s;
        # if the helper is down the app falls back to event.json street/city, then coordinates
        proxy_intercept_errors on; error_page 502 504 = @geo_down;
    }
    location @geo_down { default_type application/json; return 503 '{"error":"helper_down"}'; }
}
